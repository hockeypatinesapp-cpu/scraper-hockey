name: Diagnóstico conexión FMP
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install -q requests
      - name: Probar
        run: |
          python - <<'PY'
          import requests
          from fmp_http import NAVEGADOR, CABECERAS
          B='https://www.server2.sidgad.es/fmp/'
          pruebas = {
            'solo UA': {'User-Agent': NAVEGADOR},
            'UA+Referer': {'User-Agent': NAVEGADOR, 'Referer': 'https://www.hockeypatines.fmp.es/'},
            'UA+AcceptLang': {'User-Agent': NAVEGADOR, 'Accept-Language': 'es-ES,es;q=0.9'},
            'CABECERAS': CABECERAS,
          }
          for nombre, h in pruebas.items():
              for metodo, url in [('get', B+'fmp_ls_1.php'), ('post', B+'fmp_ls_1.php'), ('post', B+'fmp_mc_1.php')]:
                  r = getattr(requests, metodo)(url, headers=h, timeout=30)
                  print(f"{r.status_code} {len(r.text):>7} {metodo.upper():4} {url[-12:]}  {nombre}")
          PY
