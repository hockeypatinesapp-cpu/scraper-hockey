name: Diagnóstico conexión FMP
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: Probar conexión con la FMP
        run: |
          curl -s https://ifconfig.me; echo
          U1='Mozilla/5.0'
          U2='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          for url in https://www.server2.sidgad.es/fmp/fmp_ls_1.php https://www.server2.sidgad.es/fmp/fmp_mc_1.php https://www.hockeypatines.fmp.es/ https://www.server2.sidgad.es/; do
            for ua in "$U1" "$U2"; do
              code=$(curl -s -o /tmp/r.html -w '%{http_code}' -X POST -A "$ua" -H 'Origin: http://www.hockeypatines.fmp.es' -H 'Referer: https://www.hockeypatines.fmp.es/' -H 'Accept-Language: es-ES,es;q=0.9' "$url")
              echo "== $code  $url  UA=${ua:0:25}"; head -c 400 /tmp/r.html | tr '\n' ' '; echo
            done
          done
          echo "== cabeceras"; curl -sI -A "$U2" https://www.server2.sidgad.es/fmp/fmp_ls_1.php | head -20
