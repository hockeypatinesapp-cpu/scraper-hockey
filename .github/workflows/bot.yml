name: Bot Calendario FMP

on:
  schedule:
    - cron: '17 1 * * *' # 01:17 UTC = 03:17 Madrid en verano / 02:17 en invierno (minuto 'raro' para evitar atascos)
  workflow_dispatch:

jobs:
  actualizar-datos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_TOKEN }} # Usamos tu llave maestra aquí para poder escribir en tu repo

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - run: pip install -r requirements.txt
      
      - name: Ejecutar el Organizador
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scraper.py

      - name: Ejecutar la Clasificación
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scraper_clasificacion.py

      - name: Guardar nuevo horario del Vigilante
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "Robot Organizador"
          git config --global user.email "bot@hockeypatines.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
          # Señal de vida mensual: evita que GitHub apague los robots tras 60 días sin cambios
          date -u +%Y-%m > .github/ultima_actividad.txt
          git add .github/workflows/vigilante.yml .github/ultima_actividad.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "⏰ Despertador / señal de vida actualizados" && git push)
