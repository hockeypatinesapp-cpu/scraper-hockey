name: Bot Plantillas FMP

on:
  schedule:
    # 01:23 UTC todos los días - MODO LIGERO
    - cron: '23 1 * * *'
    # 02:43 UTC solo el día 1 de cada mes - MODO COMPLETO
    - cron: '43 2 1 * *'
  
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Elige el modo de extracción:'
        required: true
        default: 'LIGERA'
        type: choice
        options:
          - LIGERA
          - COMPLETA

jobs:
  actualizar-plantillas:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5
        
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: Instalar librerías
        run: pip install -r requirements.txt
        
      - name: Ejecutar Extractor de Plantillas
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          # Lógica inteligente para decidir el modo
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            export TIPO_ACTUALIZACION="${{ github.event.inputs.tipo }}"
          elif [ "${{ github.event.schedule }}" == "43 2 1 * *" ]; then
            export TIPO_ACTUALIZACION="COMPLETA"
          else
            export TIPO_ACTUALIZACION="LIGERA"
          fi
          
          python scraper_plantillas.py
